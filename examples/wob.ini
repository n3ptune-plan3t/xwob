# xwob - Wayland backend (wob fork). Full reference: man xwob-wayland.ini
# Copy to ~/.config/xwob/wob.ini

timeout = 1000
max = 100
# show "NN%" on the bar (black or white, picked per pixel to contrast)
show_percentage = yes

width = 400
height = 50
border_offset = 4
border_size = 4
bar_padding = 4
orientation = horizontal
anchor = bottom
margin = 100

# "50!" (or "50 alt") uses the built-in alt style; override it like this:
# [style.alt]
# bar_color = 555555
