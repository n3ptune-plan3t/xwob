# xwob - ONE configuration for both backends (X11 and Wayland).
# Copy to ~/.config/xwob/xwob.ini
#
# The same file drives the X11 backend (xob fork) and the Wayland backend
# (wob fork), so the bar looks the same everywhere. Format and keys are those
# of wob.ini; see `man xwob-wayland.ini` and `man xwob`. The values below are
# the built-in defaults, so an empty file gives the same bar.
#
# Global keys must come before any [section].

# milliseconds the bar stays visible, and the value that fills it
timeout = 1000
max = 100

# show "NN%" on the bar (black or white, picked per pixel to contrast)
show_percentage = yes

# Size of the whole bar in pixels, not swapped for vertical bars: for a
# vertical bar use e.g. width = 50, height = 400.
width = 400
height = 50
# gap outside the border / border thickness / gap between border and fill
border_offset = 4
border_size = 4
bar_padding = 4
orientation = horizontal

# Position: any of top bottom left right center, and margin from that edge as
# one value or "top right bottom left". Opposite anchors centre on that axis.
anchor = center
# margin = 100

# wrap:   130 with max 100 shows 30% in the overflow colours
# nowrap: stays full, in the overflow colours
overflow_mode = wrap

# Colours as RRGGBB or RRGGBBAA
bar_color = ffffff
border_color = ffffff
background_color = 00000090
overflow_bar_color = ff0000
overflow_border_color = ff0000
overflow_background_color = 00000090

# "50!" (or "50 alt") uses the alt style. Its backgrounds follow the global
# ones unless set here. Defaults:
# [style.alt]
# bar_color = 555555
# border_color = 555555
# overflow_bar_color = 550000
# overflow_border_color = 550000

# Wayland only, ignored on X11: per-output overrides and extra named styles
# ([style.NAME], selected with "50 NAME"). X11 supports the alt style only.
# [output.laptop]
# match = eDP-1
# anchor = bottom
